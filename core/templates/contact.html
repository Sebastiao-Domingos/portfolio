{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto px-6 py-24">
    <h1 class="text-4xl font-bold text-center mb-4 translatable" data-pt="Contacta-me" data-en="Get In Touch">Contacta-me</h1>
    <p class="text-center text-slate-600 mb-12 translatable" data-pt="Estou disponível para conversar sobre oportunidades ou colaborações." data-en="I am available to discuss opportunities or collaborations.">Estou disponível para conversar sobre oportunidades ou colaborações.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="bg-green-100 border border-green-400 text-green-700 px-6 py-4 rounded-2xl mb-8 text-center">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" class="bg-white shadow-xl rounded-3xl p-10">
        {% csrf_token %}
        <div class="space-y-8">
            {{form.as_p}}
        </div>
        <button type="submit" class="w-full mt-10 bg-teal-700 hover:bg-teal-800 text-white py-3 rounded-2xl text-lg font-medium transition translatable" data-pt="Enviar Mensagem" data-en="Send Message">
            Enviar Mensagem
        </button>
    </form>
</div>
{% endblock %}
