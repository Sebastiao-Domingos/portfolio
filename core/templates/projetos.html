{% extends 'base.html' %}
{% block content %}

<div class="max-w-6xl mx-auto px-6 py-16">

    <!-- Título -->
    <div class="text-center max-w-3xl mx-auto mb-12">
        <h1 class="text-4xl md:text-5xl font-bold text-slate-800 translatable"
            data-pt="Projetos Realizados"
            data-en="Projects">
            Projetos Realizados
        </h1>
        <p class="text-slate-600 text-lg md:text-xl mt-4 translatable"
           data-pt="Alguns dos meus trabalhos mais recentes"
           data-en="Some of my most recent works">
            Alguns dos meus trabalhos mais recentes
        </p>
    </div>

    <!-- Lista vertical (tipo "mini-carousel" com hover) -->
    <div class="space-y-6 relative">
        {% for proj in projects %}

        <div class="group rounded-2xl overflow-hidden cursor-pointer">
            <div class="flex md:flex-row items-center gap-6 p-5 md:p-7 group-hover:bg-slate-50/40 transition-colors duration-300">

                <!-- Ícone/esquerda com linha vertical -->
                <div class="flex items-center gap-3">
                    <div class="
                        h-20 w-20 md:h-24 md:w-24
                        rounded-2xl {{ proj.gradient }} flex items-center justify-center text-white text-3xl md:text-4xl
                        transition-transform duration-300 group-hover:scale-105 group-hover:rotate-1
                    ">
                        {{ proj.icon }}
                    </div>
                    <div class="h-16 w-0.5 bg-slate-300 hidden md:block"></div>
                </div>

                <!-- Conteúdo (direita) -->
                <div class="flex-1">
                    <h3 class="text-xl md:text-2xl font-semibold text-slate-800 translatable mb-1"
                        data-pt="{{ proj.title.data_pt }}"
                        data-en="{{ proj.title.data_en }}">
                        {{ proj.title.data_pt }}
                    </h3>
                    <p class="text-slate-600 text-sm md:text-base mb-2 translatable"
                       data-pt="{{ proj.description.data_pt }}"
                       data-en="{{ proj.description.data_en }}">
                        {{ proj.description.data_pt }}
                    </p>
                    <div class="flex flex-wrap gap-2">
                        {% for tech in proj.technologies %}
                        <span class="bg-slate-100 text-slate-700 text-xs px-3 py-1.5 rounded-full">{{ tech }}</span>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>

        {% endfor %}
    </div>
</div>

{% endblock %}
