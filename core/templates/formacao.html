{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="max-w-6xl mx-auto px-5 md:px-6 py-16">

    <h1 class="text-5xl font-bold text-center mb-4 translatable" 
        data-pt="Formação Acadêmica" data-en="Academic Background">
        Formação Acadêmica
    </h1>
    <p class="text-center text-slate-600 text-xl mb-20 translatable" 
       data-pt="Minha trajetória académica" data-en="My academic journey">
        Minha trajetória académica
    </p>

    <!-- Dados serializados corretamente no view -->
    <script>
        const educationsData = [
            {% for edu in educations %}
            {
                "title": "{{ edu.title.data_pt|escapejs }}",
                "conquistas": {{ edu.conquistas_json|safe }},
                "projetos": {{ edu.projetos_json|safe }},
                "certificado_pdf": "{{ edu.certificado_pdf_url|escapejs }}",
                "historico_pdf": "{{ edu.historico_pdf_url|escapejs }}"
            }{% if not forloop.last %},{% endif %}
            {% endfor %}
        ];
    </script>

    <div class="grid md:grid-cols-2 gap-10">

        {% for edu in educations %}
        <div class="bg-white rounded-3xl shadow-xl p-10 hover:shadow-2xl transition-all duration-500 group">

            <div class="flex justify-between items-start mb-8">
                <div>
                    <h3 class="text-2xl font-semibold">{{ edu.title.data_pt }}</h3>
                    <p class="text-teal-600 font-medium mt-2">{{ edu.institution.data_pt }}</p>
                </div>
                <span class="bg-teal-100 text-teal-700 px-5 py-2 rounded-2xl text-sm font-medium">
                    {{ edu.period }}
                </span>
            </div>

            <p class="text-slate-600 leading-relaxed mb-10">{{ edu.description.data_pt }}</p>

            <div class="grid grid-cols-3 gap-4">
                <button onclick="openConquistas({{ forloop.counter0 }})" 
                        class="flex flex-col items-center justify-center bg-slate-50 hover:bg-teal-50 border border-slate-200 hover:border-teal-300 rounded-2xl py-6 transition-all">
                    <span class="text-3xl mb-2">🏆</span>
                    <span class="text-sm font-medium">Conquistas</span>
                </button>

                <button onclick="openHistorico({{ forloop.counter0 }})" 
                        class="flex flex-col items-center justify-center bg-slate-50 hover:bg-teal-50 border border-slate-200 hover:border-teal-300 rounded-2xl py-6 transition-all">
                    <span class="text-3xl mb-2">📜</span>
                    <span class="text-sm font-medium">Histórico</span>
                </button>

                <button onclick="openProjetos({{ forloop.counter0 }})" 
                        class="flex flex-col items-center justify-center bg-slate-50 hover:bg-teal-50 border border-slate-200 hover:border-teal-300 rounded-2xl py-6 transition-all">
                    <span class="text-3xl mb-2">💻</span>
                    <span class="text-sm font-medium">Projetos</span>
                </button>
            </div>
        </div>
        {% endfor %}

    </div>
</div>

<!-- ====================== MODAL ====================== -->
<div id="modal" class="hidden fixed inset-0 bg-black/80 items-center justify-center z-[10000] p-4">
    <div class="bg-white rounded-3xl w-full max-w-5xl max-h-[95vh] flex flex-col shadow-2xl overflow-hidden">
        <div class="flex justify-between items-center px-8 py-6 border-b">
            <h2 id="modalTitle" class="text-2xl font-semibold"></h2>
            <button onclick="closeModal()" class="text-4xl text-slate-400 hover:text-red-500">✕</button>
        </div>
        <div id="modalContent" class="flex-1 p-8 overflow-auto"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let currentIndex = null;

function openModal(title, html) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalContent').innerHTML = html;
    const modal = document.getElementById('modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
}

function closeModal() {
    const modal = document.getElementById('modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    currentIndex = null;
}

// Fechar ao clicar fora do modal
document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

// Fechar com ESC
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function openConquistas(index) {
    currentIndex = index;
    const edu = educationsData[index];
    let html = `<h3 class="text-xl font-semibold mb-6">Conquistas</h3><div class="space-y-6">`;
    edu.conquistas.forEach(item => {
        html += `<div class="flex items-start gap-4"><span class="text-4xl">🏆</span><p>${item.data_pt}</p></div>`;
    });
    html += `</div>`;
    openModal(edu.title, html);
}

function openProjetos(index) {
    currentIndex = index;
    const edu = educationsData[index];
    let html = `<h3 class="text-xl font-semibold mb-6">Projetos Desenvolvidos</h3><div class="space-y-6">`;
    edu.projetos.forEach(p => {
        html += `<div class="border-l-4 border-teal-600 pl-6 py-3"><p class="font-medium">${p.data_pt}</p></div>`;
    });
    html += `</div>`;
    openModal(edu.title, html);
}

function openHistorico(index) {
    currentIndex = index;
    const edu = educationsData[index];
    const html = `
        <div class="flex border-b mb-6">
            <button onclick="switchTab(0)" id="tab0" class="tab-button flex-1 py-4 font-medium border-b-2 border-teal-600 text-teal-600">Certificados</button>
            <button onclick="switchTab(1)" id="tab1" class="tab-button flex-1 py-4 font-medium">Histórico Académico</button>
        </div>
        <div id="pdfContainer" class="bg-slate-100 rounded-2xl p-4 min-h-[65vh] flex items-center justify-center">
            <canvas id="pdfCanvas" class="mx-auto shadow-inner"></canvas>
        </div>`;

    openModal(edu.title, html);
    setTimeout(() => loadPdf(edu.certificado_pdf), 300);
}

function switchTab(n) {
    document.querySelectorAll('.tab-button').forEach(btn =>
        btn.classList.remove('border-b-2', 'border-teal-600', 'text-teal-600'));
    document.getElementById('tab' + n).classList.add('border-b-2', 'border-teal-600', 'text-teal-600');

    const edu = educationsData[currentIndex];
    loadPdf(n === 0 ? edu.certificado_pdf : edu.historico_pdf);
}

async function loadPdf(pdfUrl) {
    const container = document.getElementById('pdfContainer');
    if (!pdfUrl) {
        container.innerHTML = '<p class="text-slate-400 text-sm">PDF não disponível.</p>';
        return;
    }

    container.innerHTML = `
        <div class="flex items-center justify-center gap-3 text-slate-400">
            <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
            </svg>
            <span class="text-sm">A carregar PDF...</span>
        </div>`;

    try {
        const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: 1.4 });

        const canvas = document.createElement('canvas');
        canvas.className = 'mx-auto shadow-inner';
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        container.innerHTML = '';
        container.appendChild(canvas);

        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    } catch (e) {
        console.error(e);
        container.innerHTML = '<p class="text-red-500 text-sm p-4">Erro ao carregar o PDF. Verifica o caminho do ficheiro.</p>';
    }
}
</script>

{% endblock %}
